# One command: docker compose up --build   ->   http://localhost:3000
# Defaults below work without a .env file. See .env.example to override.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-experiment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-experiment}
      POSTGRES_DB: ${POSTGRES_DB:-experiment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Backend starts only after Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-experiment}:${POSTGRES_PASSWORD:-experiment}@db:5432/${POSTGRES_DB:-experiment}
      CONFIG_PATH: /app/config.yml
      DEV_MODE: ${DEV_MODE:-1}
    volumes:
      - ./config.yml:/app/config.yml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
